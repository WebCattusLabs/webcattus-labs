{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
</section>

<section style="padding: 5rem 0;">
  <div class="container" style="max-width: 760px;">
    {{ .Content }}
  </div>
</section>
{{ end }}
